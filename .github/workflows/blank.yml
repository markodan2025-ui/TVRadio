          echo "Projekt raspakiran u: $ROOT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build FLAC decoder (Google media3 + libFLAC 1.3.4, NDK)
        run: |
          set -e
          git clone --depth 1 --branch 1.3.1 https://github.com/androidx/media.git m3
          cd m3/libraries/decoder_flac/src/main/jni
          curl -fL -o flac.tar.xz https://downloads.xiph.org/releases/flac/flac-1.3.4.tar.xz \
            || curl -fL -o flac.tar.xz https://github.com/xiph/flac/releases/download/1.3.4/flac-1.3.4.tar.xz
          tar xf flac.tar.xz
          mv flac-1.3.4 flac
          NDK="$ANDROID_NDK_LATEST_HOME"
          if [ -z "$NDK" ]; then NDK="$ANDROID_NDK_HOME"; fi
          echo "NDK: $NDK"
          "$NDK/ndk-build" APP_ABI="armeabi-v7a arm64-v8a x86 x86_64" APP_PLATFORM=android-21 -j4
          rm -rf ../libs/riscv64 ../obj/local/riscv64
          cd "$GITHUB_WORKSPACE/m3"
          ./gradlew :lib-decoder-flac:assembleRelease --no-daemon
          AAR=$(find . -name "*.aar" -path "*decoder*flac*" | grep -i release | head -1)
          echo "AAR: $AAR"
          mkdir -p aarx && unzip -q "$AAR" -d aarx
          mkdir -p "$GITHUB_WORKSPACE/$ROOT/app/libs"
          cp aarx/classes.jar "$GITHUB_WORKSPACE/$ROOT/app/libs/flac-decoder.jar"
          J="$GITHUB_WORKSPACE/$ROOT/app/src/main/jniLibs"
          mkdir -p "$J"
          if [ -d aarx/jni ]; then cp -r aarx/jni/* "$J/"; fi
          if [ -d libraries/decoder_flac/src/main/libs ]; then cp -r libraries/decoder_flac/src/main/libs/* "$J/"; fi
          rm -rf "$J/riscv64"
          echo "=== jniLibs sadržaj ==="
          find "$J" -type f
          SOCNT=$(find "$J" -name "*.so" | wc -l)
          echo ".so datoteka: $SOCNT"
          if [ "$SOCNT" -lt 1 ]; then echo "GREŠKA: native dekoder NIJE izgrađen!"; exit 1; fi

      - name: Build APK
        run: |
          cd "$ROOT"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioTV-APK
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk
