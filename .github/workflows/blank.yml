          B64EOF
          base64 -d p.b64 > RadioTV.zip
          mkdir -p src
          unzip -q RadioTV.zip -d src
          ROOT=$(dirname $(find src -name settings.gradle.kts | head -1))
          echo "ROOT=$ROOT" >> $GITHUB_ENV
          echo "Projekt raspakiran u: $ROOT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build FLAC decoder (Google media3 + libFLAC)
        run: |
          git clone --depth 1 --branch 1.3.1 https://github.com/androidx/media.git m3
          cd m3/libraries/decoder_flac/src/main/jni
          curl -L -o flac.tar.xz https://github.com/xiph/flac/releases/download/1.4.2/flac-1.4.2.tar.xz
          tar xf flac.tar.xz
          mv flac-1.4.2 flac
          cd "$GITHUB_WORKSPACE/m3"
          ./gradlew :lib-decoder-flac:assembleRelease --no-daemon
          AAR=$(find . -name "*.aar" -path "*decoder*flac*" | grep -i release | head -1)
          echo "AAR: $AAR"
          mkdir -p aarx && unzip -q "$AAR" -d aarx
          mkdir -p "$GITHUB_WORKSPACE/$ROOT/app/libs"
          cp aarx/classes.jar "$GITHUB_WORKSPACE/$ROOT/app/libs/flac-decoder.jar"
          mkdir -p "$GITHUB_WORKSPACE/$ROOT/app/src/main/jniLibs"
          cp -r aarx/jni/* "$GITHUB_WORKSPACE/$ROOT/app/src/main/jniLibs/"
          echo "=== jniLibs ==="
          find "$GITHUB_WORKSPACE/$ROOT/app/src/main/jniLibs" -type f

      - name: Build APK
        run: |
          cd "$ROOT"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioTV-APK
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk
