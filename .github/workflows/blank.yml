          echo "Projekt raspakiran u: $ROOT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          cd "$ROOT"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioTV-APK
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk
